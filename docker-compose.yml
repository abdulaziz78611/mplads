services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mplad_intelligence
      POSTGRES_USER: mplad
      POSTGRES_PASSWORD: mplad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplad -d mplad_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
